<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Loan Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            position: relative;
            overflow: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: floatUp 15s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 120px; height: 120px; left: 30%; animation-delay: 3s; }
        .particle:nth-child(3) { width: 60px; height: 60px; left: 50%; animation-delay: 6s; }
        .particle:nth-child(4) { width: 100px; height: 100px; left: 70%; animation-delay: 2s; }
        .particle:nth-child(5) { width: 40px; height: 40px; left: 85%; animation-delay: 8s; }
        .particle:nth-child(6) { width: 150px; height: 150px; left: 20%; animation-delay: 4s; }
        .particle:nth-child(7) { width: 70px; height: 70px; left: 60%; animation-delay: 7s; }
        .particle:nth-child(8) { width: 90px; height: 90px; left: 45%; animation-delay: 1s; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            animation: floatShape 20s infinite ease-in-out;
            z-index: 0;
        }

        .floating-shape:nth-child(1) { width: 300px; height: 300px; top: -100px; right: -100px; animation-delay: 0s; }
        .floating-shape:nth-child(2) { width: 200px; height: 200px; bottom: -50px; left: -50px; animation-delay: 5s; }

        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -30px) rotate(90deg); }
            50% { transform: translate(-20px, 20px) rotate(180deg); }
            75% { transform: translate(20px, 30px) rotate(270deg); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 15px;
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-box .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-box .logo i {
            font-size: 48px;
            color: #667eea;
            animation: pulseIcon 2s infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-box .logo h2 {
            color: white;
            font-weight: 700;
            margin-top: 10px;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .login-box .logo p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            transition: all 0.3s;
        }

        .input-wrapper:hover {
            transform: translateY(-1px);
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 18px;
            padding-right: 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .input-wrapper input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            background: none;
            border: none;
            font-size: 18px;
            padding: 5px;
            transition: all 0.3s;
            z-index: 10;
        }

        .password-toggle:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            margin-top: 5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .alert {
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 15px;
            border: none;
            font-size: 14px;
        }

        .alert-danger {
            background: rgba(231, 76, 60, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .alert-success {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.2);
        }

        .spinner-container {
            display: none;
            text-align: center;
            padding: 10px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }
            .login-box .logo h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="floating-shape"></div>
    <div class="floating-shape"></div>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <i class="fas fa-landmark"></i>
                <h2>Loan Management System</h2>
                <p>Secure access to your loan portal</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="togglePasswordBtn">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="button" class="btn-login" id="loginBtn">
                    <span class="btn-content">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </span>
                </button>

                <div id="spinner" class="spinner-container">
                    <div class="spinner"></div>
                    <p style="color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 10px;">Authenticating...</p>
                </div>

                <div id="message" class="mt-3"></div>
            </form>
        </div>
    </div>

    <script>
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded - Login page ready');

            // ============================================================
            //  PASSWORD TOGGLE
            // ============================================================
            var toggleBtn = document.getElementById('togglePasswordBtn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    var passwordInput = document.getElementById('password');
                    var icon = this.querySelector('i');
                    
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.className = 'fas fa-eye-slash';
                    } else {
                        passwordInput.type = 'password';
                        icon.className = 'fas fa-eye';
                    }
                });
                console.log('Password toggle initialized');
            }

            // ============================================================
            //  LOGIN HANDLER
            // ============================================================
            var loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Login button clicked');
                    handleLogin();
                });
                console.log('Login button initialized');
            }

            // ============================================================
            //  ENTER KEY SUPPORT
            // ============================================================
            var usernameField = document.getElementById('username');
            var passwordField = document.getElementById('password');

            if (usernameField) {
                usernameField.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        passwordField.focus();
                    }
                });
            }

            if (passwordField) {
                passwordField.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        console.log('Enter key pressed on password field');
                        handleLogin();
                    }
                });
            }

            // ============================================================
            //  LOGIN FUNCTION
            // ============================================================
            async function handleLogin() {
                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value;
                var messageDiv = document.getElementById('message');
                var btn = document.getElementById('loginBtn');
                var spinner = document.getElementById('spinner');

                console.log('handleLogin called with username:', username);

                // Reset UI
                messageDiv.innerHTML = '';
                btn.disabled = true;
                btn.innerHTML = '<span class="btn-content"><i class="fas fa-spinner fa-spin"></i> Signing in...</span>';
                spinner.style.display = 'block';

                // Validate input
                if (!username || !password) {
                    messageDiv.innerHTML = '<div class="alert alert-danger">❌ Please enter both username and password</div>';
                    btn.disabled = false;
                    btn.innerHTML = '<span class="btn-content"><i class="fas fa-sign-in-alt"></i> Sign In</span>';
                    spinner.style.display = 'none';
                    return;
                }

                try {
                    console.log('Sending login request for:', username);

                    var response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ username: username, password: password })
                    });

                    var data = await response.json();
                    console.log('Response received:', data);

                    // Reset button
                    btn.disabled = false;
                    btn.innerHTML = '<span class="btn-content"><i class="fas fa-sign-in-alt"></i> Sign In</span>';
                    spinner.style.display = 'none';

                    if (response.ok && data.success) {
                        // Store authentication data
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));

                        messageDiv.innerHTML = '<div class="alert alert-success">✅ Login successful! Redirecting...</div>';
                        
                        // Redirect based on role
                        setTimeout(function() {
                            if (data.user && data.user.role === 'CUSTOMER') {
                                window.location.href = '/customer-dashboard.html';
                            } else {
                                window.location.href = '/dashboard.html';
                            }
                        }, 800);
                    } else {
                        // Show error message
                        messageDiv.innerHTML = '<div class="alert alert-danger">❌ ' + (data.message || 'Invalid username or password') + '</div>';
                        
                        // Clear password field
                        document.getElementById('password').value = '';
                        document.getElementById('password').focus();
                    }
                } catch(error) {
                    console.error('Login error:', error);
                    btn.disabled = false;
                    btn.innerHTML = '<span class="btn-content"><i class="fas fa-sign-in-alt"></i> Sign In</span>';
                    spinner.style.display = 'none';
                    messageDiv.innerHTML = '<div class="alert alert-danger">❌ Connection error. Please check if the server is running.</div>';
                }
            }

            // ============================================================
            //  CHECK IF ALREADY LOGGED IN
            // ============================================================
            const token = localStorage.getItem('token');
            if (token) {
                console.log('Token found, verifying...');
                // Verify token is still valid
                fetch('/api/auth/verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.valid) {
                        const user = JSON.parse(localStorage.getItem('user') || '{}');
                        console.log('Token valid, redirecting to:', user.role);
                        if (user.role === 'CUSTOMER') {
                            window.location.href = '/customer-dashboard.html';
                        } else {
                            window.location.href = '/dashboard.html';
                        }
                    }
                })
                .catch(() => {
                    // Token invalid, clear it
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                });
            }
        });
    </script>

</body>
</html>
