<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Loan Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-box {
            max-width: 420px;
            margin: 120px auto;
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-box h2 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 25px;
        }
        .login-box h2 i {
            color: #2a5298;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 600;
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 40px;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }
        .password-toggle:hover {
            color: #333;
        }
        .alert {
            border-radius: 8px;
        }
        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .role-badge.admin {
            background: #1e3c72;
            color: white;
        }
        .role-badge.customer {
            background: #28a745;
            color: white;
        }
        .login-hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 10px;
            text-align: center;
        }
        .login-hint span {
            display: inline-block;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2><i class="fas fa-landmark"></i> Loan Management System</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div id="message" class="mt-3"></div>
            
            <div class="login-hint">
                <span><span class="role-badge admin">Admin</span> admin / admin123</span>
                <span><span class="role-badge customer">Customer</span> manoahjohn / manoah123</span>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, icon) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            
            document.getElementById('message').innerHTML = '<div class="alert alert-info">Checking credentials...</div>';
            
            // FIRST: Check if it's Admin
            if (username === 'admin' && password === 'admin123') {
                document.getElementById('message').innerHTML = '<div class="alert alert-success">Redirecting to Admin Dashboard...</div>';
                setTimeout(function() {
                    window.location.href = '/dashboard.html';
                }, 500);
                return;
            }
            
            // SECOND: Check if it's Customer (via API)
            try {
                var response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await response.json();
                
                if (response.ok) {
                    document.getElementById('message').innerHTML = '<div class="alert alert-success">Redirecting to Customer Dashboard...</div>';
                    setTimeout(function() {
                        window.location.href = '/customer-dashboard.html';
                    }, 500);
                } else {
                    document.getElementById('message').innerHTML = '<div class="alert alert-danger">' + data.error + '</div>';
                }
            } catch(e) {
                document.getElementById('message').innerHTML = '<div class="alert alert-danger">Login failed</div>';
            }
        });
    </script>
</body>
